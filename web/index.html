<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sphere Laser Warp</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <script>
    // apply a saved theme before first paint to avoid a flash
    try { var t = localStorage.getItem('sphere-laser-warp-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <div class="headrow">
      <h1><img class="logo" src="./favicon.svg" alt="" /><span data-i18n="title">Sphere Laser Warp</span></h1>
      <div class="headtools">
        <a class="donate" href="https://www.paypal.me/stefanriese" target="_blank" rel="noopener noreferrer" data-i18n="donate">Donate</a>
        <label class="theme"><span data-i18n="theme">Theme</span>
          <select id="theme">
            <option value="auto" data-i18n="themeAuto">System</option>
            <option value="light" data-i18n="themeLight">Light</option>
            <option value="dark" data-i18n="themeDark">Dark</option>
          </select>
        </label>
        <label class="lang"><span data-i18n="language">Language</span>
          <select id="lang">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
          </select>
        </label>
      </div>
    </div>
    <p data-i18n="subtitle">Pre-distort an image so it looks undistorted when engraved on a ball with a chuck rotary. Runs entirely in your browser.</p>
  </header>
  <main>
    <section class="controls">
      <label><span data-i18n="preset">Machine preset</span>
        <select id="preset"></select>
      </label>
      <label><span data-i18n="image">Image (PNG, JPG, SVG, ...)</span> <input id="file" type="file" accept="image/*,.svg" /></label>
      <div class="buttons">
        <button id="sampleBtn" type="button" class="secondary" data-i18n="sampleBtn">Sample image</button>
        <button id="calBtn" type="button" class="secondary" data-i18n="calBtn">Calibration pattern</button>
      </div>
      <label><span data-i18n="ballDiameter">Ball diameter (mm)</span> <input id="ballDiameterMm" type="number" min="10" step="0.5" value="70" /></label>
      <label><span data-i18n="sizeBy">Define image size by</span>
        <select id="sizeBy">
          <option value="width" data-i18n="sizeWidth">Width</option>
          <option value="height" data-i18n="sizeHeight">Height</option>
        </select>
      </label>
      <label><span id="sizeLabel">Image width on ball (mm)</span> <input id="imageSizeMm" type="number" min="1" step="0.5" value="40" /></label>
      <label><span data-i18n="axisAngle">Rotation axis direction in the image (deg, 0 = horizontal, 90 = vertical)</span> <input id="axisAngleDeg" type="number" min="-180" max="180" step="1" value="0" /></label>
      <label><span data-i18n="offsetAxis">Image position along the axis (mm from ball centre)</span> <input id="offsetAxisMm" type="number" step="0.5" value="0" /></label>
      <label><span data-i18n="projection">Projection</span>
        <select id="projection">
          <option value="equidistant" data-i18n="projEquidistant">Equidistant (true distances)</option>
          <option value="stereographic" data-i18n="projStereographic">Stereographic (no shape stretch)</option>
          <option value="equalarea" data-i18n="projEqualArea">Equal-area</option>
        </select>
      </label>
      <label><span data-i18n="dpi">Resolution (dpi)</span> <input id="dpi" type="number" min="50" max="1000" step="1" value="254" /></label>
      <label><span data-i18n="ballColor">Ball colour (3D preview only)</span> <input id="ballColor" type="color" value="#9b1c1c" /></label>
      <label class="check"><input id="showAxis" type="checkbox" checked /> <span data-i18n="showAxis">Show rotation axis in 3D preview</span></label>
      <label><span data-i18n="orientation">Export orientation</span>
        <select id="orientation">
          <option value="rows" data-i18n="orientRows">Rotation along image height (axis horizontal)</option>
          <option value="cols" data-i18n="orientCols">Rotation along image width (axis vertical)</option>
        </select>
      </label>
      <label class="check"><input id="whiteBg" type="checkbox" checked /> <span data-i18n="whiteBg">White background (instead of transparent)</span></label>
      <div class="buttons">
        <button id="dlPng" disabled data-i18n="dlPng">Download PNG</button>
        <button id="dlSvg" disabled data-i18n="dlSvg">Download SVG</button>
      </div>
      <button id="dlVector" type="button" disabled data-i18n="dlVector">Download vector SVG (paths)</button>
      <p id="info" class="info"></p>
      <details id="calib">
        <summary data-i18n="calibSummary">Check a test engraving</summary>
        <ol class="steps">
          <li data-i18n="calStep1"></li>
          <li data-i18n="calStep2"></li>
          <li data-i18n="calStep3"></li>
        </ol>
        <label><span data-i18n="measAxis">Square along the axis (mm)</span> <input id="measAxis" type="number" step="0.05" min="0" /></label>
        <label><span data-i18n="measAround">Square around the ball (mm)</span> <input id="measAround" type="number" step="0.05" min="0" /></label>
        <p id="calResult" class="info"></p>
        <button id="applyDiameter" type="button" class="secondary" hidden data-i18n="applyDiameter">Apply suggested ball diameter</button>
      </details>
      <p id="warn" class="warn" hidden></p>
    </section>
    <section class="preview">
      <canvas id="out"></canvas>
      <p class="hint" id="fileHint"></p>
      <h2 data-i18n="preview3d">3D preview</h2>
      <label class="inline"><span data-i18n="show">Show</span>
        <select id="previewMode">
          <option value="warp" data-i18n="modeWarp">With warp (corrected, what you will engrave)</option>
          <option value="naive" data-i18n="modeNaive">Without warp (original image engraved as is)</option>
        </select>
      </label>
      <div id="ball3d" class="ball3d"></div>
      <p class="hint" data-i18n="hint3d"></p>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
