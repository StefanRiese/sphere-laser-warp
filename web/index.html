<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sphere Laser Warp</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>Sphere Laser Warp</h1>
    <p>Pre-distort an image so it looks undistorted when engraved on a ball with a chuck rotary. Runs entirely in your browser.</p>
  </header>
  <main>
    <section class="controls">
      <label>Image <input id="file" type="file" accept="image/*" /></label>
      <label>Ball diameter (mm) <input id="ballDiameterMm" type="number" min="10" step="0.5" value="70" /></label>
      <label>Image width on ball (mm) <input id="imageWidthMm" type="number" min="1" step="0.5" value="40" /></label>
      <label>Projection
        <select id="projection">
          <option value="equidistant">Equidistant (true distances)</option>
          <option value="stereographic">Stereographic (no shape stretch)</option>
          <option value="equalarea">Equal-area</option>
        </select>
      </label>
      <label>Latitude limit (deg) <input id="latitudeLimitDeg" type="number" min="5" max="80" step="1" value="30" /></label>
      <label>Resolution (dpi) <input id="dpi" type="number" min="50" max="1000" step="1" value="254" /></label>
      <label class="check"><input id="mirror" type="checkbox" /> Mirror (engrave from the inside)</label>
      <label class="check"><input id="flipRotation" type="checkbox" /> Reverse rotation direction</label>
      <label class="check"><input id="whiteBg" type="checkbox" checked /> White background (instead of transparent)</label>
      <div class="buttons">
        <button id="dlPng" disabled>Download PNG</button>
        <button id="dlSvg" disabled>Download SVG</button>
      </div>
      <p id="info" class="info"></p>
      <p id="warn" class="warn" hidden></p>
    </section>
    <section class="preview">
      <canvas id="out"></canvas>
      <p class="hint">Preview of the file to import: width runs along the rotation axis, height wraps around the ball.</p>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
